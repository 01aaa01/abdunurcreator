<!-- ======= LOGIN / SIGNUP ======= -->
<div class="stage" id="stage-login">
  <div class="lang-switch" id="lang-switch-login">
    <button type="button" class="lang-btn" data-lang="uz">UZ</button>
    <button type="button" class="lang-btn" data-lang="ru">RU</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>
  <div class="glass panel">
    <div class="logo">
      <img src="cat.png" alt="Logo" class="logo-img">
      <span style="white-space:nowrap;">NOOR AI</span>
    </div>

    <div class="tabs" style="margin-bottom:20px;">
      <button class="tab active" id="auth-tab-login" onclick="switchAuthTab('login')" data-i18n="auth.tabLogin">Kirish</button>
      <button class="tab" id="auth-tab-signup" onclick="switchAuthTab('signup')" data-i18n="auth.tabSignup">Ro'yxatdan o'tish</button>
    </div>

    <!-- LOGIN PANE -->
    <div id="auth-pane-login">
      <div class="auth-methods" id="login-methods">
        <button class="btn auth-btn tg" onclick="chooseAuthMethod('login','telegram')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 4L2.5 11l6 2.2m12.5-9.2L15 20l-6.5-6.8m12.5-9.2L8.5 13.2" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span data-i18n="auth.viaTelegram">Telegram bilan kirish</span>
        </button>
        <button class="btn ghost auth-btn" onclick="chooseAuthMethod('login','password')">
          <span data-i18n="auth.viaPassword">Login va parol bilan</span>
        </button>
        <button class="btn ghost auth-btn" onclick="chooseAuthMethod('login','email')">
          <span data-i18n="auth.viaEmail">Email orqali kirish</span>
        </button>
        <div class="google-btn-wrap">
          <button type="button" class="btn auth-btn google" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span data-i18n="auth.viaGoogle">Google bilan kirish</span>
          </button>
          <div id="google-btn-overlay-login" class="google-btn-overlay"></div>
        </div>
      </div>

      <!-- Password login -->
      <div class="auth-subform hidden" id="login-sub-password">
        <div class="field">
          <label data-i18n="auth.identifierLabel">Username yoki Email</label>
          <input type="text" id="login-identifier" placeholder="username yoki email" autocomplete="username">
        </div>
        <div class="field">
          <label data-i18n="login.passwordLabel">Parol</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn" onclick="handleLoginSubmit()" data-i18n="login.btn">Kirish</button>
        <div class="err" id="login-error-password"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px;">
          <button class="btn ghost sm" onclick="showLoginMethods()" data-i18n="auth.back">Orqaga</button>
          <button class="btn ghost sm" onclick="showForgotPassword()" data-i18n="auth.forgotPassword">Parolni unutdingizmi?</button>
        </div>
      </div>

      <!-- Telegram login -->
      <div class="auth-subform hidden" id="login-sub-telegram">
        <div class="field">
          <label data-i18n="login.usernameLabel">Telegram username</label>
          <span class="prefix">@</span>
          <input type="text" id="login-tg-username" class="with-prefix" placeholder="username" autocomplete="off">
        </div>
        <div class="field hidden" id="login-code-wrap">
          <label data-i18n="login.codeLabel">Kod</label>
          <input type="text" id="login-code" maxlength="6" placeholder="123456" style="text-align:center;letter-spacing:.3em;font-weight:bold;">
        </div>
        <button class="btn" id="login-tg-btn" onclick="handleTelegramLogin()" data-i18n="auth.sendCode">Kod yuborish</button>
        <div class="err" id="login-error-tg"></div>
        <p class="hint" data-i18n="login.hint">Avval botga <b>/start</b> yuborgan bo'lishingiz kerak, kod bot orqali keladi.</p>
        <button class="btn ghost" onclick="showLoginMethods()" data-i18n="auth.back">Orqaga</button>
      </div>

      <!-- Email login -->
      <div class="auth-subform hidden" id="login-sub-email">
        <div class="field">
          <label data-i18n="auth.emailLabel">Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field hidden" id="login-email-code-wrap">
          <label data-i18n="login.codeLabel">Kod</label>
          <input type="text" id="login-email-code" maxlength="6" placeholder="123456" style="text-align:center;letter-spacing:.3em;font-weight:bold;">
        </div>
        <button class="btn" id="login-email-btn" onclick="handleLoginEmailSubmit()" data-i18n="auth.sendCode">Kod yuborish</button>
        <div class="err" id="login-email-error"></div>
        <button class="btn ghost" onclick="showLoginMethods()" data-i18n="auth.back">Orqaga</button>
      </div>

      <!-- Forgot password -->
      <div class="auth-subform hidden" id="login-sub-forgot">
        <div class="field">
          <label data-i18n="auth.identifierLabel">Username yoki Email</label>
          <input type="text" id="forgot-identifier" placeholder="username yoki email" autocomplete="username">
        </div>
        <div class="field hidden" id="forgot-code-wrap">
          <label data-i18n="login.codeLabel">Kod</label>
          <input type="text" id="forgot-code" maxlength="6" placeholder="123456" style="text-align:center;letter-spacing:.3em;font-weight:bold;">
        </div>
        <div class="field hidden" id="forgot-password-wrap">
          <label data-i18n="auth.newPassword">Yangi parol</label>
          <input type="password" id="forgot-password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn" id="forgot-btn" onclick="handleForgotSubmit()" data-i18n="auth.sendCode">Kod yuborish</button>
        <div class="err" id="forgot-error"></div>
        <div class="ok" id="forgot-ok"></div>
        <button class="btn ghost" onclick="showLoginMethods()" data-i18n="auth.back">Orqaga</button>
      </div>
    </div>

    <!-- SIGNUP PANE -->
    <div id="auth-pane-signup" class="hidden">
      <div id="signup-form-step1">
        <div class="field">
          <label data-i18n="auth.fullName">To'liq ism</label>
          <input type="text" id="signup-name" placeholder="Ism Familiya" autocomplete="name">
        </div>
        <div class="field">
          <label data-i18n="auth.usernameLabel">Username</label>
          <input type="text" id="signup-username" placeholder="username" autocomplete="username">
        </div>
        <div class="field">
          <label data-i18n="auth.emailOptional">Email (ixtiyoriy)</label>
          <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label data-i18n="auth.passwordMin">Parol (kamida 6 belgi)</label>
          <input type="password" id="signup-password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="field">
          <label data-i18n="auth.confirmPassword">Parolni tasdiqlang</label>
          <input type="password" id="signup-password2" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn" onclick="handleSignupStep1()" data-i18n="auth.continue">Davom etish</button>
        <div class="err" id="signup-step1-error"></div>
      </div>

      <div id="signup-form-step2" class="hidden">
        <p class="sub" data-i18n="auth.chooseVerify">Tasdiqlash usulini tanlang:</p>
        <div class="auth-methods" style="margin-top:14px;">
          <button class="btn auth-btn tg" onclick="handleSignupMethod('telegram')" data-i18n="auth.verifyTelegram">Telegram orqali tasdiqlash</button>
          <button class="btn ghost auth-btn" onclick="handleSignupMethod('email')" data-i18n="auth.verifyEmail">Email orqali tasdiqlash</button>
          <div class="google-btn-wrap">
            <button type="button" class="btn auth-btn google" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              <span data-i18n="auth.signupGoogle">Google orqali ro'yxatdan o'tish</span>
            </button>
            <div id="google-btn-overlay-signup" class="google-btn-overlay"></div>
          </div>
        </div>
        <div class="err" id="signup-step2-error"></div>
        <button class="btn ghost" onclick="showSignupStep1()" data-i18n="auth.back">Orqaga</button>
      </div>

      <div id="signup-form-telegram" class="hidden">
        <p class="sub" data-i18n="auth.tgVerifyHint">Botga o'ting va <b>/start</b> yuboring, so'ng tasdiqlash tugmasini bosing.</p>
        <a class="btn auth-btn tg" id="signup-tg-verify-link" href="https://t.me/abdunurcreator_bot" target="_blank" data-i18n="auth.verifyInTelegram">Telegram'da tasdiqlash</a>
        <button class="btn ghost" onclick="handleSignupTelegramCheck()" style="margin-top:10px;" data-i18n="auth.iVerified">Tasdiqladim, davom etish</button>
        <div class="err" id="signup-tg-error"></div>
        <button class="btn ghost" onclick="showSignupStep2()" data-i18n="auth.back">Orqaga</button>
      </div>

      <div id="signup-form-email" class="hidden">
        <p class="sub" data-i18n="auth.codeSent">Kod yuborildi: <b id="signup-email-display"></b></p>
        <div class="field">
          <label data-i18n="login.codeLabel">Kod</label>
          <input type="text" id="signup-email-code" maxlength="6" placeholder="123456" style="text-align:center;letter-spacing:.3em;font-weight:bold;">
        </div>
        <button class="btn" onclick="handleSignupEmailVerify()" data-i18n="auth.verify">Tasdiqlash</button>
        <div class="err" id="signup-email-error"></div>
        <button class="btn ghost" onclick="showSignupStep2()" data-i18n="auth.back">Orqaga</button>
      </div>
    </div>
  </div>
</div>
