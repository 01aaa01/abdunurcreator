<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menga Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gray-800 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-start sm:flex-row sm:items-center sm:justify-between py-6">
                <div class="flex items-center space-x-4">
                    <img class="h-8 w-8" src="#" alt="Logo">
                    <span class="text-xl font-bold">Menga Shop</span>
                </div>
                <nav class="mt-4 sm:mt-0 sm:space-x-6">
                    <a href="#" class="hover:text-gray-300 transition">Bosh</a>
                    <a href="#" class="hover:text-gray-300 transition">Mahsulotlar</a>
                    <a href="#" class="hover:text-gray-300 transition">-email catoy</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="py-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <h2 class="text-3xl font-bold text-center mb-12">Mahsulotlar</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Product Card 1 -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-md overflow-hidden">
                        <img class="w-full h-48 object-center object-cover" src="product1.jpg" alt="Mahsulot 1">
                        <div class="p-6">
                            <h3 class="text-lg font-medium text-gray-900">Mahsulot 1</h3>
                            <p class="mt-1 text-gray-500">$29.99</p>
                            <button class="mt-4 w-full bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition">Hamaytirish</button>
                        </div>
                    </div>
                    <!-- Product Card 2 -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-md overflow-hidden">
                        <img class="w-full h-48 object-center object-cover" src="product2.jpg" alt="Mahsulot 2">
                        <div class="p-6">
                            <h3 class="text-lg font-medium text-gray-900">Mahsulot 2</h3>
                            <p class="mt-1 text-gray-500">$39.99</p>
                            <button class="mt-4 w-full bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition">Hamaytirish</button>
                        </div>
                    </div>
                    <!-- Product Card 3 -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-md overflow-hidden">
                        <img class="w-full h-48 object-center object-cover" src="product3.jpg" alt="Mahsulot 3">
                        <div class="p-6">
                            <h3 class="text-lg font-medium text-gray-900">Mahsulot 3</h3>
                            <p class="mt-1 text-gray-500">$49.99</p>
                            <button class="mt-4 w-full bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition">Hamaytirish</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <p class="text-center text-gray-300">&copy; 2023 Menga Shop. Barcha mangfi xavfsiz kerak-las</p>
        </div>
    </footer>
</body>
</html>
